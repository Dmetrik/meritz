# 코드 ↔ 스펙 문서 드리프트 점검
#
# .github/workflows/spec-drift.yml 로 복사해서 쓰세요.
#
# 이 워크플로는 경고만 남기고 빌드를 실패시키지 않습니다.
# 도입 초기에 CI를 빨갛게 만들면 팀은 문서를 고치는 대신 검사를 꺼버립니다.
# 팀이 이 흐름에 익숙해진 뒤에 실패로 바꾸는 걸 검토하세요.

name: spec-drift

on:
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "api/**"
      - "prisma/**"
      - "package.json"
      - ".env.example"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # last_synced_commit 까지 거슬러 올라가야 합니다

      - name: 스펙 문서 존재 여부
        id: has_spec
        run: |
          if ls docs/specs/*.md >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::스펙 문서가 없습니다. Claude Code 에서 /product-spec:new 로 만들 수 있습니다."
          fi

      - name: 동기화 시점 확인
        if: steps.has_spec.outputs.found == 'true'
        run: |
          for spec in docs/specs/*.md; do
            base=$(grep -m1 '^last_synced_commit:' "$spec" | sed 's/last_synced_commit:[[:space:]]*//')
            [ -z "$base" ] && continue

            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "::warning file=$spec::기준 커밋 $base 를 찾을 수 없습니다 (rebase 또는 force push). /product-spec:update 로 범위를 다시 지정하세요."
              continue
            fi

            behind=$(git rev-list --count "$base..HEAD")
            if [ "$behind" -gt 0 ]; then
              echo "::warning file=$spec::코드가 $behind 개 커밋 앞서 있습니다. Claude Code 에서 /product-spec:update 를 실행해 주세요."
            else
              echo "$spec — 최신 상태"
            fi
          done

# 더 깊은 점검(엔드포인트·환경변수 대조)은 Claude Code 에서 /product-spec:check 를 실행하세요.
# CI에서 자동화하려면 아래처럼 Claude Code Action 을 붙일 수 있습니다.
